name: deploy-validate

on:
  workflow_run:
    workflows: [build-scan-push]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "SHA completo del commit cuya imagen se despliega"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-mbco-reto
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'acrmbcoreto' }}
  IMAGE_NAME: hola-mibanco
  RESOURCE_GROUP: rg-mbco-reto
  CLUSTER_NAME: aks-mbco-reto
  NAMESPACE: mbco-reto-ns
  EXPECTED_BODY: "Hola Mibanco Challenge"

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
    steps:
      - name: Validar el tag de la imagen
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::El tag debe ser un SHA completo de 40 caracteres, recibido: '$IMAGE_TAG'"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Comprobar que la imagen existe en el ACR
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --output none

      - name: Credenciales del cluster
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing

      - name: Fijar la imagen en los manifiestos
        working-directory: deploy
        run: |
          kustomize edit set image \
            "$IMAGE_NAME=$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
          kustomize build . | grep "image:"

      - name: Aplicar manifiestos
        run: kubectl apply -k deploy

      - name: Esperar el rollout
        run: kubectl rollout status deployment/hola-mibanco -n "$NAMESPACE" --timeout=300s

      - name: Diagnostico si el rollout falla
        if: failure()
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide || true
          kubectl describe deployment hola-mibanco -n "$NAMESPACE" || true
          kubectl describe pods -n "$NAMESPACE" -l app=hola-mibanco || true
          kubectl logs -n "$NAMESPACE" -l app=hola-mibanco --tail=100 || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -20 || true

      - name: Validar pods, servicio, ingress y HPA
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide
          kubectl get svc,ingress,hpa -n "$NAMESPACE"

      - name: Probar la aplicacion con curl
        run: |
          IP=""
          for i in $(seq 1 30); do
            IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$IP" ] && break
            echo "Esperando IP del Ingress ($i/30)..."
            sleep 5
          done
          if [ -z "$IP" ]; then
            echo "::error::El Ingress no obtuvo IP publica"
            exit 1
          fi
          echo "Ingress: http://$IP/"

          for i in $(seq 1 20); do
            BODY=$(curl -fsS --max-time 5 "http://$IP/" || true)
            if [ "$BODY" = "$EXPECTED_BODY" ]; then
              echo "Respuesta correcta en el intento $i: $BODY"
              {
                echo '### Despliegue validado'
                echo "- Imagen: \`$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG\`"
                echo "- URL: http://$IP/"
                echo "- Respuesta: \`$BODY\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $i/20 sin respuesta esperada (recibido: '$BODY'). Reintentando en 6 s..."
            sleep 6
          done
          echo "::error::La aplicacion no devolvio '$EXPECTED_BODY' tras 20 intentos"
          exit 1
