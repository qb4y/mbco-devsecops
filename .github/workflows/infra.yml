name: infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.1"
  TF_DIR: infra/terraform
  INGRESS_NGINX_CHART_VERSION: "4.15.1"
  APP_NAMESPACE: mbco-reto-ns
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT || 'stmbcotfstate' }}
  TF_VAR_acr_name: ${{ vars.ACR_NAME || 'acrmbcoreto' }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD_AUTH: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formato
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_DIR }}

      - name: Init sin backend
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

  plan:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -input=false -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT"
        working-directory: ${{ env.TF_DIR }}

      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        working-directory: ${{ env.TF_DIR }}

      - name: Resumen del plan
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ env.TF_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 3

  apply:
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Init
        run: terraform init -input=false -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT"
        working-directory: ${{ env.TF_DIR }}

      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
        working-directory: ${{ env.TF_DIR }}

  post-config:
    if: github.event_name != 'pull_request'
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Credenciales del cluster
        run: |
          az aks get-credentials \
            --resource-group rg-mbco-reto \
            --name aks-mbco-reto \
            --overwrite-existing

      - name: Validar nodos
        run: kubectl get nodes -o wide

      - name: Instalar Ingress NGINX
        run: |
          helm upgrade --install ingress-nginx ingress-nginx \
            --repo https://kubernetes.github.io/ingress-nginx \
            --version "$INGRESS_NGINX_CHART_VERSION" \
            --namespace ingress-nginx --create-namespace \
            --set controller.service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-request-path"=/healthz \
            --wait --timeout 10m

      - name: Crear namespace de la aplicacion
        run: |
          kubectl create namespace "$APP_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Estado final
        run: |
          kubectl get pods -n ingress-nginx
          kubectl get svc -n ingress-nginx
          kubectl get ns "$APP_NAMESPACE"
