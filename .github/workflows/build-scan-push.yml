name: build-scan-push

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-scan-push.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACR_NAME: acrmbcoreto
  IMAGE_NAME: hola-mibanco

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Compilar y probar
        run: ./mvnw -B -ntp verify
        working-directory: app

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-files: app/pom.xml
          skip-dirs: docs

  image:
    needs: [test, codeql, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen
        run: docker build -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" app

      - name: Escanear imagen (gate de severidad)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login en Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar en ACR
        if: github.event_name != 'pull_request'
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

      - name: Resumen
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '### Imagen publicada'
            echo "\`$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
